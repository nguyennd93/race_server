services:
  api:
    build: .                       # build từ Dockerfile cùng thư mục
    container_name: race_api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2567:2567"
    environment:
      # DB giờ là RDS (không còn container mysql). DATABASE_URL lấy nguyên từ .env
      # (deploy-dev.yml tự dựng, host = endpoint RDS).
      DATABASE_URL: "${DATABASE_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN}"
      PORT: "3000"
      GAME_PORT: "2567"
