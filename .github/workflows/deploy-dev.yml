name: Deploy Dev

# Tự deploy lên EC2 dev khi push nhánh develop (hoặc bấm tay).
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Đóng gói code (chạy TRƯỚC khi tạo .env để không gói nhầm file env)
      - name: Package
        run: tar czf server.tar.gz --exclude='node_modules' --exclude='dist' --exclude='.env' --exclude='.git' .

      # Dựng .env từ các secret riêng lẻ (nhạy cảm) + giá trị cố định (không nhạy cảm)
      - name: Build .env
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DEV_MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.DEV_MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD"
            echo "MYSQL_DATABASE=race_game"
            echo "MYSQL_USER=race_user"
            echo "MYSQL_PASSWORD=$MYSQL_PASSWORD"
            echo "DATABASE_URL=mysql://race_user:$MYSQL_PASSWORD@mysql:3306/race_game"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "JWT_EXPIRES_IN=30d"
            echo "PORT=3000"
            echo "GAME_PORT=2567"
            echo "NODE_ENV=development"
          } > env.generated

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "server.tar.gz,env.generated"
          target: "~"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            mkdir -p ~/server
            tar xzf ~/server.tar.gz -C ~/server
            mv ~/env.generated ~/server/.env
            cd ~/server
            docker compose --env-file .env up -d --build
            docker image prune -f
            echo "✅ Dev deployed"
