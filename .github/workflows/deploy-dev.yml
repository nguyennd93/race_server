name: Deploy Dev

# Tự deploy lên EC2 dev khi push nhánh develop (hoặc bấm tay).
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Đóng gói code (.env KHÔNG nằm trong repo — sẽ ghi từ secret bên dưới)
      - name: Package
        run: tar czf server.tar.gz --exclude='node_modules' --exclude='dist' --exclude='.env' --exclude='.git' .

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "server.tar.gz"
          target: "~"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        env:
          DEV_ENV_B64: ${{ secrets.DEV_ENV_B64 }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: DEV_ENV_B64
          script: |
            mkdir -p ~/server
            tar xzf ~/server.tar.gz -C ~/server
            cd ~/server
            # Ghi .env từ secret (base64) -> nguồn duy nhất là GitHub Secret
            echo "$DEV_ENV_B64" | base64 -d > .env
            docker compose --env-file .env up -d --build
            docker image prune -f
            echo "✅ Dev deployed"
