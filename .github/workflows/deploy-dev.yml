name: Deploy Dev

# Tự deploy lên EC2 dev khi push nhánh develop (hoặc bấm tay).
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Đóng gói code. Nén ra thư mục tạm rồi đưa vào để tar không tự-nén-chính-nó
      # (tránh lỗi "tar: .: file changed as we read it").
      - name: Package
        run: |
          tar czf "$RUNNER_TEMP/server.tar.gz" \
            --exclude='node_modules' --exclude='dist' --exclude='.env' --exclude='.git' .
          mv "$RUNNER_TEMP/server.tar.gz" server.tar.gz

      # Dựng .env từ các secret riêng lẻ (nhạy cảm) + giá trị cố định (không nhạy cảm)
      # DB giờ là RDS: host = Variable DEV_DB_HOST (endpoint RDS),
      # user = race_user, mật khẩu = secret DEV_MYSQL_PASSWORD.
      - name: Build .env
        env:
          DB_PASSWORD: ${{ secrets.DEV_MYSQL_PASSWORD }}
          DB_HOST: ${{ vars.DEV_DB_HOST }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          REST_DOMAIN: ${{ vars.DEV_REST_DOMAIN }}
          RT_DOMAIN: ${{ vars.DEV_RT_DOMAIN }}
        run: |
          {
            echo "DATABASE_URL=mysql://race_user:$DB_PASSWORD@$DB_HOST:3306/race_game"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "JWT_EXPIRES_IN=30d"
            echo "PORT=3000"
            echo "GAME_PORT=2567"
            echo "NODE_ENV=development"
            echo "REST_DOMAIN=$REST_DOMAIN"
            echo "RT_DOMAIN=$RT_DOMAIN"
          } > env.generated

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "server.tar.gz,env.generated"
          target: "~"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            mkdir -p ~/server
            tar xzf ~/server.tar.gz -C ~/server
            mv ~/env.generated ~/server/.env
            cd ~/server
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
            docker image prune -f
            echo "✅ Dev deployed (HTTPS qua Caddy)"
