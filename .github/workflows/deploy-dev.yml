name: Deploy Dev

# Tự deploy lên EC2 dev khi push nhánh develop (hoặc bấm tay).
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Đóng gói code (bỏ thứ không cần — .env nằm sẵn trên EC2)
      - name: Package
        run: tar czf server.tar.gz --exclude='node_modules' --exclude='dist' --exclude='.env' --exclude='.git' .

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "server.tar.gz"
          target: "~"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            mkdir -p ~/server
            tar xzf ~/server.tar.gz -C ~/server
            cd ~/server
            docker compose --env-file .env up -d --build
            docker image prune -f
            echo "✅ Dev deployed"
