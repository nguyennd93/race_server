name: Deploy Dev

# Tự deploy lên EC2 dev khi push nhánh develop (hoặc bấm tay).
# .env được kéo từ AWS SSM Parameter Store NGAY TRÊN EC2 (qua IAM role),
# nên GitHub chỉ cần DEV_HOST + DEV_SSH_KEY (không giữ secret ứng dụng).
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: tar czf server.tar.gz --exclude='node_modules' --exclude='dist' --exclude='.env' --exclude='.git' .

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "server.tar.gz"
          target: "~"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            mkdir -p ~/server
            tar xzf ~/server.tar.gz -C ~/server
            cd ~/server
            command -v aws >/dev/null || { sudo apt-get update -y && sudo apt-get install -y awscli; }
            chmod +x fetch-env.sh
            AWS_REGION=ap-southeast-1 SSM_PATH=/race/dev ./fetch-env.sh
            docker compose --env-file .env up -d --build
            docker image prune -f
            echo "✅ Dev deployed"
